<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/svg+xml" href="/satify-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e1e1e" />
    <meta name="description" content="Master the Digital SAT with authentic Bluebook-style practice questions, Desmos graphing calculator, live timers, and real skill analytics." />
    <meta property="og:title" content="SATify — Digital SAT Bluebook Practice" />
    <meta property="og:description" content="Master the Digital SAT with authentic Bluebook-style practice questions, Desmos graphing calculator, live timers, and real skill analytics." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/satify-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>SATify — Digital SAT Bluebook Practice</title>
    
    <!-- Google Fonts: Inter & Source Serif 4 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    
    <!-- Immediate Theme Initialization to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('satify_theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Desmos API for Bluebook Calculator -->
    <script src="https://www.desmos.com/api/v1.9/calculator.js?apiKey=dff6ea11e7df4482bab9a540c52a64a0"></script>
    
    <!-- Google Identity Services (GIS) for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: system-ui, sans-serif; background-color: #11131A; color: #F4F4F6;">
        <strong>JavaScript Required</strong>
        <p style="margin-top: 8px; font-size: 14px; color: #8E95A5;">
          SATify requires JavaScript to run the interactive Digital SAT Bluebook practice experience. Please enable JavaScript in your browser settings.
        </p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
